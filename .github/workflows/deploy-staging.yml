name: Deploy POSCLINIC Staging

# dev.clinic.posgro.uz on the posgro Contabo VPS (Germany). Production (clinic.posgro.uz, same
# VPS for now) is deploy.yml, on push to main.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run prisma:generate:sqlite && npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.server.json
      - run: npx tsx --test "src/server/**/*.test.ts"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Needed only for .github/actions/ssh-deploy: the deploy script itself is pulled on the
      # VPS from the branch being deployed.
      - uses: actions/checkout@v5

      - name: Deploy to staging
        uses: ./.github/actions/ssh-deploy
        with:
          host:          ${{ secrets.SSH_HOST }}
          username:      ${{ secrets.SSH_USER }}
          key:           ${{ secrets.SSH_KEY }}
          known_hosts:   ${{ secrets.SSH_KNOWN_HOSTS }}
          env_file:      ${{ secrets.ENV_FILE }}
          gh_pat:        ${{ secrets.GH_PAT }}
          repo_owner:    Bobur815
          repo_name:     posclinic
          branch:        dev
          project_dir:   posclinic-staging
          deploy_script: scripts/deploy/staging.sh
