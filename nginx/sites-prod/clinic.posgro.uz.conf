# posclinic PRODUCTION: API (/api, used by tills and the dashboard) + clinic dashboard (/web).
# Container on 127.0.0.1:3013 (docker-compose.yml). Installed by scripts/deploy/production.sh
# only once this host is listed in nginx/sites-live-prod.txt (i.e. its certificate exists);
# until then an ACME stub is served. The filename is the certificate name.

server {
    listen 80;
    listen [::]:80;
    server_name clinic.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/clinic.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.posgro.uz/privkey.pem;
    include snippets/posclinic-ssl.conf;
    include snippets/posclinic-gzip.conf;

    # A sync batch (≤ 200 visits with items) fits easily; the API itself caps JSON at 5 MB.
    client_max_body_size 6M;

    location /api/ {
        proxy_pass http://127.0.0.1:3013;
        include snippets/posclinic-proxy.conf;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3013/api/health;
        include snippets/posclinic-proxy.conf;
    }

    location /web/ {
        proxy_pass http://127.0.0.1:3013;
        include snippets/posclinic-proxy.conf;
    }

    location = / {
        return 302 /web/;
    }

    location / {
        return 404;
    }
}
