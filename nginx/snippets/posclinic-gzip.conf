# Compress text responses (sync batches and reports are JSON). Server level only, never in
# /etc/nginx/nginx.conf: the VPS is shared with other projects.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    text/plain
    image/svg+xml;
