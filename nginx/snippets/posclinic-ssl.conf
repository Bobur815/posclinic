# TLS + security headers for posclinic hosts (own copy, so the setup moves to the Uzbekistan
# VPS unchanged). Certificate paths stay in each site file: the deploy script uses them to tell
# a live host from one that still needs an ACME stub.

ssl_session_timeout 1d;
ssl_session_cache   shared:POSCLINIC_SSL:10m;
ssl_session_tickets off;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
ssl_prefer_server_ciphers off;

add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "same-origin" always;
